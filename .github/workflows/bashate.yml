---
# yamllint disable rule:line-length
name: bashate
'on':
  push:
    branches:
      - master
    paths:
      - '**.sh'
      - '**.bash'
      - '.github/workflows/bashate.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.sh'
      - '**.bash'
      - '.github/workflows/bashate.yml'
permissions:
  contents: read
jobs:
  bashate:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - run: pip install bashate
      - run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -exec bashate -i E006,E003 {} +

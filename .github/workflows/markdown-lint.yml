---
# yamllint disable rule:line-length
name: markdown-lint
'on':
  push:
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  workflow_call:
permissions:
  contents: read
jobs:
  markdown-lint:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
